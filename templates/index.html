<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 本地视频自动剪辑系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* 主布局 */
        .main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1024px) {
            .main {
                grid-template-columns: 1fr;
            }
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        /* 上传区域 */
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.active {
            border-color: #00c853;
            background: #f1f8f4;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 1.1em;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #00c853;
            color: white;
        }

        .btn-success:hover {
            background: #00a040;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .btn-secondary {
            background: #999;
            color: white;
        }

        .btn-secondary:hover {
            background: #777;
        }

        /* 视频列表 */
        .video-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .video-item {
            background: #f5f5f5;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-info {
            flex: 1;
        }

        .video-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .video-meta {
            font-size: 0.9em;
            color: #999;
        }

        .video-actions {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        .video-actions button {
            padding: 8px 12px;
            font-size: 0.9em;
        }

        /* 统计信息 */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* 分析结果 */
        .analysis-result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
        }

        .analysis-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .analysis-item:last-child {
            border-bottom: none;
        }

        .analysis-label {
            color: #666;
            font-weight: bold;
        }

        .analysis-value {
            color: #667eea;
            font-weight: bold;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
        }

        /* 标签页 */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* 消息提示 */
        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 全屏覆盖 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .video-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 本地视频自动剪辑系统</h1>
            <p>智能检测 • 自动剪辑 • 快速导出</p>
        </div>

        <!-- 消息提示 -->
        <div id="message" class="message"></div>

        <!-- 主要内容 -->
        <div class="main">
            <!-- 左侧：上传和视频列表 -->
            <div class="card">
                <h2>📁 视频管理</h2>

                <!-- 上传区域 -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📹</div>
                    <div class="upload-text">拖拽视频文件到此处或点击上传</div>
                    <input type="file" id="fileInput" accept="video/*" multiple>
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        选择文件
                    </button>
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
                    <h3 style="margin-bottom: 15px; color: #333;">🔍 扫描目录</h3>
                    <div class="form-group">
                        <input type="text" id="scanDirectory" placeholder="输入目录路径">
                        <button class="btn btn-success" onclick="scanDirectory()">
                            扫描
                        </button>
                    </div>
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
                    <h3 style="margin-bottom: 15px; color: #333;">📊 视频库</h3>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value" id="totalVideos">0</div>
                            <div class="stat-label">总视频数</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="totalSize">0GB</div>
                            <div class="stat-label">总大小</div>
                        </div>
                    </div>

                    <h3 style="margin: 20px 0 15px; color: #333;">视频列表</h3>
                    <div class="video-list" id="videoList">
                        <div style="text-align: center; color: #999; padding: 20px;">
                            暂无视频
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：分析和剪辑 -->
            <div class="card">
                <h2>✂️ 自动剪辑</h2>

                <!-- 标签页 -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('analyze')">分析</button>
                    <button class="tab" onclick="switchTab('autocut')">自动剪辑</button>
                    <button class="tab" onclick="switchTab('edit')">手动编辑</button>
                </div>

                <!-- 分析标签页 -->
                <div id="analyze" class="tab-content active">
                    <div class="form-group">
                        <label>选择视频：</label>
                        <select id="analyzeVideo">
                            <option value="">-- 请选择视频 --</option>
                        </select>
                    </div>

                    <button class="btn btn-primary" onclick="analyzeVideo()">
                        开始分析
                    </button>

                    <div id="analyzeResult"></div>
                </div>

                <!-- 自动剪辑标签页 -->
                <div id="autocut" class="tab-content">
                    <div class="form-group">
                        <label>选择视频：</label>
                        <select id="autoCutVideo">
                            <option value="">-- 请选择视频 --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="removeSilence" checked>
                            移除静音区间
                        </label>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="removeBlack" checked>
                            移除黑屏区间
                        </label>
                    </div>

                    <div class="form-group">
                        <label>目标时长（秒）：</label>
                        <input type="number" id="targetDuration" placeholder="不填表示自动剪辑">
                    </div>

                    <button class="btn btn-primary" onclick="autoCutVideo()">
                        开始剪辑
                    </button>

                    <div id="autoCutResult"></div>

                    <div id="exportControls" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
                        <div class="form-group">
                            <label>输出文件名：</label>
                            <input type="text" id="outputName" value="output" placeholder="输出文件名">
                        </div>

                        <div class="form-group">
                            <label>编码器：</label>
                            <select id="codec">
                                <option value="libx264">H.264 (推荐)</option>
                                <option value="libx265">H.265 (高压缩)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>比特率：</label>
                            <select id="bitrate">
                                <option value="2000k">2000k (720p)</option>
                                <option value="5000k" selected>5000k (1080p)</option>
                                <option value="8000k">8000k (高清)</option>
                            </select>
                        </div>

                        <button class="btn btn-success" onclick="exportVideo()">
                            导出视频
                        </button>
                    </div>
                </div>

                <!-- 手动编辑标签页 -->
                <div id="edit" class="tab-content">
                    <div class="form-group">
                        <label>选择视频：</label>
                        <select id="editVideo">
                            <option value="">-- 请选择视频 --</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>开始时间（秒）：</label>
                            <input type="number" id="editStart" value="0">
                        </div>
                        <div class="form-group">
                            <label>结束时间（秒）：</label>
                            <input type="number" id="editEnd" placeholder="不填表示到末尾">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>宽度：</label>
                            <input type="number" id="editWidth" placeholder="不填表示不改">
                        </div>
                        <div class="form-group">
                            <label>高度：</label>
                            <input type="number" id="editHeight" placeholder="不填表示不改">
                        </div>
                    </div>

                    <button class="btn btn-primary" onclick="editVideo()">
                        开始编辑
                    </button>

                    <div id="editResult"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载模态框 -->
    <div id="loadingModal" class="modal">
        <div style="text-align: center;">
            <div class="loading"></div>
            <p style="color: white; margin-top: 20px;">处理中，请稍候...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // ==================== 工具函数 ====================

        function showMessage(message, type = 'info') {
            const msgEl = document.getElementById('message');
            msgEl.textContent = message;
            msgEl.className = `message show ${type}`;
            setTimeout(() => msgEl.classList.remove('show'), 5000);
        }

        function showLoading(show = true) {
            const modal = document.getElementById('loadingModal');
            if (show) {
                modal.classList.add('show');
            } else {
                modal.classList.remove('show');
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // ==================== API 调用 ====================

        async function loadVideos() {
            try {
                const response = await fetch(`${API_URL}/videos`);
                const data = await response.json();

                if (!data.success) {
                    showMessage('获取视频列表失败', 'error');
                    return;
                }

                updateVideoList(data.data);
                updateSelectOptions(data.data);
                loadStatistics();
            } catch (error) {
                showMessage('连接错误: ' + error.message, 'error');
            }
        }

        function updateVideoList(videos) {
            const listEl = document.getElementById('videoList');

            if (videos.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无视频</div>';
                return;
            }

            listEl.innerHTML = videos.map(v => `
                <div class="video-item">
                    <div class="video-info">
                        <div class="video-name">📹 ${v.name}</div>
                        <div class="video-meta">
                            ${Math.floor(v.duration)}秒 • ${v.size_mb.toFixed(1)}MB • ${v.resolution}
                        </div>
                    </div>
                    <div class="video-actions">
                        <button class="btn btn-secondary" onclick="viewDetails('${v.hash}')">详情</button>
                        <button class="btn btn-danger" onclick="deleteVideo('${v.hash}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function updateSelectOptions(videos) {
            const selects = ['analyzeVideo', 'autoCutVideo', 'editVideo'];
            const options = '<option value="">-- 请选择视频 --</option>' + 
                videos.map(v => `<option value="${v.hash}">${v.name}</option>`).join('');

            selects.forEach(id => {
                document.getElementById(id).innerHTML = options;
            });
        }

        async function loadStatistics() {
            try {
                const response = await fetch(`${API_URL}/statistics`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalVideos').textContent = data.data.total_videos;
                    document.getElementById('totalSize').textContent = data.data.total_size_gb.toFixed(2) + 'GB';
                }
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // ==================== 上传文件 ====================

        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('active');
        });

        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('active');
        });

        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('active');
            handleFiles(e.dataTransfer.files);
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                const formData = new FormData();
                formData.append('file', file);

                showLoading(true);

                try {
                    const response = await fetch(`${API_URL}/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.success) {
                        showMessage(`✅ ${data.data.name} 上传成功`, 'success');
                        loadVideos();
                    } else {
                        showMessage(`❌ ${file.name} 上传失败: ${data.error}`, 'error');
                    }
                } catch (error) {
                    showMessage('上传错误: ' + error.message, 'error');
                } finally {
                    showLoading(false);
                }
            }
        }

        // ==================== 扫描目录 ====================

        async function scanDirectory() {
            const directory = document.getElementById('scanDirectory').value;

            if (!directory) {
                showMessage('请输入目录路径', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ directory })
                });
                const data = await response.json();

                if (data.success) {
                    showMessage(`✅ ${data.message}`, 'success');
                    loadVideos();
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('扫描错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== 分析视频 ====================

        async function analyzeVideo() {
            const videoHash = document.getElementById('analyzeVideo').value;

            if (!videoHash) {
                showMessage('请选择视频', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/analyze/${videoHash}`);
                const data = await response.json();

                if (data.success) {
                    showMessage('分析完成', 'success');
                    displayAnalysisResult(data.data);
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('分析错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function displayAnalysisResult(data) {
            const result = document.getElementById('analyzeResult');
            result.innerHTML = `
                <div class="analysis-result">
                    <div class="analysis-item">
                        <span class="analysis-label">视频名称</span>
                        <span class="analysis-value">${data.video_name}</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">时长</span>
                        <span class="analysis-value">${Math.floor(data.duration)}秒</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">静音区间</span>
                        <span class="analysis-value">${data.silence_regions}个</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">黑屏区间</span>
                        <span class="analysis-value">${data.black_regions}个</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">场景切换</span>
                        <span class="analysis-value">${data.scene_changes}个</span>
                    </div>
                </div>
            `;
        }

        // ==================== 自动剪辑 ====================

        async function autoCutVideo() {
            const videoHash = document.getElementById('autoCutVideo').value;
            const removeSilence = document.getElementById('removeSilence').checked;
            const removeBlack = document.getElementById('removeBlack').checked;
            const targetDuration = document.getElementById('targetDuration').value || null;

            if (!videoHash) {
                showMessage('请选择视频', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/auto-cut`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_hash: videoHash,
                        remove_silence: removeSilence,
                        remove_black: removeBlack,
                        target_duration: targetDuration ? parseFloat(targetDuration) : null
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('✅ 剪辑完成', 'success');
                    displayCutResult(data.data);
                    document.getElementById('exportControls').style.display = 'block';
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('剪辑错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        function displayCutResult(data) {
            const result = document.getElementById('autoCutResult');
            result.innerHTML = `
                <div class="analysis-result">
                    <div class="analysis-item">
                        <span class="analysis-label">原始时长</span>
                        <span class="analysis-value">${Math.floor(data.original_duration)}秒</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">保留时长</span>
                        <span class="analysis-value">${data.kept_duration}秒</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">节省比例</span>
                        <span class="analysis-value">${data.reduction}</span>
                    </div>
                    <div class="analysis-item">
                        <span class="analysis-label">片段数</span>
                        <span class="analysis-value">${data.segments}</span>
                    </div>
                </div>
            `;
        }

        // ==================== 导出视频 ====================

        async function exportVideo() {
            const videoHash = document.getElementById('autoCutVideo').value;
            const outputName = document.getElementById('outputName').value;
            const codec = document.getElementById('codec').value;
            const bitrate = document.getElementById('bitrate').value;

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/export`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_hash: videoHash,
                        output_name: outputName,
                        codec,
                        bitrate
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showMessage(`✅ 导出成功! 文件大小: ${data.data.file_size_mb}MB`, 'success');
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('导出错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== 手动编辑 ====================

        async function editVideo() {
            const videoHash = document.getElementById('editVideo').value;
            const start = parseFloat(document.getElementById('editStart').value) || 0;
            const end = document.getElementById('editEnd').value ? parseFloat(document.getElementById('editEnd').value) : null;
            const width = document.getElementById('editWidth').value ? parseInt(document.getElementById('editWidth').value) : null;
            const height = document.getElementById('editHeight').value ? parseInt(document.getElementById('editHeight').value) : null;

            if (!videoHash) {
                showMessage('请选择视频', 'error');
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/edit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        video_hash: videoHash,
                        start,
                        end,
                        width,
                        height
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    document.getElementById('editResult').innerHTML = `
                        <div class="analysis-result">
                            <div class="analysis-item">
                                <span class="analysis-label">输出路径</span>
                                <span class="analysis-value">${data.data.output_path}</span>
                            </div>
                        </div>
                    `;
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('编辑错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== 删除视频 ====================

        async function deleteVideo(videoHash) {
            if (!confirm('确定要删除这个视频吗？')) {
                return;
            }

            showLoading(true);

            try {
                const response = await fetch(`${API_URL}/delete/${videoHash}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('✅ 视频已删除', 'success');
                    loadVideos();
                } else {
                    showMessage(`❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('删除错误: ' + error.message, 'error');
            } finally {
                showLoading(false);
            }
        }

        // ==================== 初始化 ====================

        window.addEventListener('load', () => {
            loadVideos();
            setInterval(loadVideos, 10000); // 每10秒刷新一次
        });
    </script>
</body>
</html>
